<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffef8"/>
      <stop offset="1" stop-color="#f1ead6"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f86c9"/>
      <stop offset="1" stop-color="#2f5f9e"/>
    </linearGradient>
    <linearGradient id="pencil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd768"/>
      <stop offset="0.5" stop-color="#f4b93a"/>
      <stop offset="1" stop-color="#d9962a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- notepad -->
  <g filter="url(#shadow)">
    <rect x="20" y="16" width="80" height="102" rx="7" fill="url(#paper)" stroke="#b7ad95" stroke-width="1.5"/>
    <path d="M20 23a7 7 0 0 1 7-7h66a7 7 0 0 1 7 7v9H20z" fill="url(#cover)"/>
  </g>

  <!-- ruled lines and margin -->
  <g stroke="#a8c3e6" stroke-width="1.6">
    <line x1="26" y1="45" x2="94" y2="45"/>
    <line x1="26" y1="55" x2="94" y2="55"/>
    <line x1="26" y1="65" x2="94" y2="65"/>
    <line x1="26" y1="75" x2="94" y2="75"/>
    <line x1="26" y1="85" x2="94" y2="85"/>
    <line x1="26" y1="95" x2="94" y2="95"/>
    <line x1="26" y1="105" x2="94" y2="105"/>
  </g>
  <line x1="36" y1="34" x2="36" y2="114" stroke="#e8817c" stroke-width="1.6"/>

  <!-- handwriting -->
  <g stroke="#4a4f57" stroke-width="2.6" stroke-linecap="round">
    <line x1="41" y1="42" x2="78" y2="42"/>
    <line x1="41" y1="52" x2="86" y2="52"/>
    <line x1="41" y1="62" x2="70" y2="62"/>
    <line x1="41" y1="72" x2="82" y2="72"/>
    <line x1="41" y1="82" x2="60" y2="82"/>
  </g>

  <!-- spiral rings -->
  <g fill="none" stroke="#5b616b" stroke-width="3" stroke-linecap="round">
    <path d="M32 26v-13a3 3 0 0 1 6 0v6"/>
    <path d="M46 26v-13a3 3 0 0 1 6 0v6"/>
    <path d="M60 26v-13a3 3 0 0 1 6 0v6"/>
    <path d="M74 26v-13a3 3 0 0 1 6 0v6"/>
    <path d="M88 26v-13a3 3 0 0 1 6 0v6" transform="translate(-2 0)"/>
  </g>

  <!-- pencil -->
  <g transform="translate(70 112) rotate(-45)" filter="url(#shadow)">
    <rect x="0" y="-7" width="52" height="14" fill="url(#pencil)"/>
    <line x1="0" y1="-2.3" x2="52" y2="-2.3" stroke="#d08a1f" stroke-width="1"/>
    <line x1="0" y1="2.3" x2="52" y2="2.3" stroke="#d08a1f" stroke-width="1"/>
    <rect x="52" y="-7" width="8" height="14" fill="#c4c8cf"/>
    <line x1="55" y1="-7" x2="55" y2="7" stroke="#9aa0a8" stroke-width="1"/>
    <path d="M60 -7h6a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-6z" fill="#ec8f96"/>
    <path d="M0 -7L-16 0L0 7z" fill="#efcf9f"/>
    <path d="M-10.3 -2.6L-16 0L-10.3 2.6z" fill="#3a3d42"/>
  </g>
</svg>
